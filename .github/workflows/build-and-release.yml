name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: dotnet workload install maui-android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Restore Dependencies
        run: dotnet restore DiaryHelper.csproj

      - name: Build and Publish Android APK
        run: >
          dotnet publish DiaryHelper.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false
          -o ./output

      - name: Rename APK for ComiStore
        run: |
          cp ./output/*-Signed.apk ./output/DiaryHelper.apk || cp ./output/*.apk ./output/DiaryHelper.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./output/DiaryHelper.apk
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
